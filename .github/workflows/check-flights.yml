name: Check Flight Prices

on:
  schedule:
    
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      test_email:
        description: "Enviar e-mail de teste?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r flight-monitor/requirements.txt

      - name: Run Flight Monitor
        working-directory: ./flight-monitor
        env:        
          TEST_EMAIL: ${{ inputs.test_email && '1' || '0' }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
          EVOLUTION_BASE_URL: ${{ secrets.EVOLUTION_BASE_URL }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          EVOLUTION_TOKEN: ${{ secrets.EVOLUTION_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python flight_monitor.py

      
      - name: Commit alert_state.json if changed
        working-directory: ./flight-monitor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f alert_state.json ]; then
            git add alert_state.json

            if ! git diff --cached --quiet; then
              git commit -m "chore: update alert state [skip ci]"
              git push
            else
              echo "Nenhuma alteração no histórico de alertas"
            fi
          else
            echo "alert_state.json ainda não existe. Nada para salvar."
          fi
